name: Verificar HEC REELS web

on:
  push:
    paths:
      - 'web/**'
      - '.github/workflows/verificar-web.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probar-web:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Revisar sintaxis
        run: |
          node --check web/app.js
          node --check web/omni.js
          node --check web/api/omni.js
          node --check web/api/_lib.js
          node --check web/api/_oauth.js
          node --check web/api/login.js
          node --check web/api/callback.js
          node --check web/api/logout.js
          node --check web/api/status.js
          node --check web/api/_draft.js
          node --check web/api/draft.js
          node --check web/api/verify.js
          node --check web/api/jobs.js
          node --check web/api/script.js
          node --check web/api/download.js
      - name: Revisar sintaxis de escena Blender
        run: |
          python -m py_compile blender_scene.py omni_producer.py
          python -m unittest discover -s tests -p test_omni.py -v
      - name: Ejecutar pruebas unitarias
        working-directory: web
        run: npm test
